# Pruebas y despliegue de identity-service. Copia del pipeline del api-gateway; cambian el .env, el puerto
# y que este compose trae su propia base. Es el de customer y finance más Redis, el JWT y el admin inicial.
#
#   push / PR a dev o main  → pruebas
#   push a main (o a mano)  → pruebas → despliegue en la VM por SSH
#
# El despliegue sube el código del repositorio a la VM y la imagen se compila allá con docker compose up
# --build, con el mismo Dockerfile y el mismo compose de desarrollo: sin registro de imágenes ni credenciales
# de GHCR en la VM. El costo es que Maven corre en el servidor (README raíz, "Primer despliegue": 4 GB de
# swap). Volver atrás: "Re-run jobs" sobre el job desplegar de una corrida vieja sube y compila ese commit
# (Flyway no deshace migraciones: un commit anterior a una migración ya aplicada no arranca).
# Los secrets viven en el environment "produccion" (README raíz, "Despliegue a producción" → "Pipeline de
# identity, customer y finance"; la lista, en .env.prod).

name: ci-cd

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers levanta PostgreSQL, Redis y RabbitMQ con el Docker que trae ubuntu-latest
      - run: mvn -B -ntp test

  desplegar:
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: produccion
    # Un despliegue no cancela al que está en curso: cortarlo a mitad de un "up" deja el contenedor a medias
    concurrency:
      group: despliegue-identity-service
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/transporte/identity-service' }}
    steps:
      - uses: actions/checkout@v4

      # Llave .pem sin huella fija del servidor: accept-new guarda la que presente la VM en la primera conexión
      # del job y exige esa misma en las siguientes. Como el runner arranca sin known_hosts, no protege contra
      # quien se haga pasar por la VM desde la primera conexión
      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vm.pem
          chmod 600 ~/.ssh/vm.pem
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/vm.pem
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF

      # La red transporte, Redis y RabbitMQ son del proyecto infra, que se levanta una vez a mano en la VM; sin ellos el
      # servicio no queda healthy y el error de compose no dice por qué. Cada comprobación sale con su código
      # para que el error diga cuál falló: con un solo ||, un usuario fuera del grupo docker se leía como "falta
      # la red"
      - name: Revisar la VM
        run: |
          # shellcheck disable=SC2029  # $DEPLOY_DIR y compañía se expanden en el runner a propósito
          set +e
          ssh vm "mkdir -p '$DEPLOY_DIR' || exit 10
            docker info >/dev/null 2>&1 || exit 11
            docker network inspect transporte >/dev/null 2>&1 || exit 12"
          rc=$?
          case $rc in
            0) ;;
            10) echo "::error::No se pudo crear $DEPLOY_DIR en la VM: revisar los permisos del usuario SSH o la variable DEPLOY_DIR"; exit 1 ;;
            11) echo "::error::El usuario SSH no puede usar Docker en la VM: sudo usermod -aG docker <usuario> y volver a correr el job"; exit 1 ;;
            12) echo "::error::Falta la red transporte en la VM: levantar antes el proyecto infra (docker compose up -d --wait en la carpeta de infra)"; exit 1 ;;
            *) echo "::error::Falló la conexión SSH a la VM (código $rc)"; exit 1 ;;
          esac

      # Se vacía la carpeta antes de descomprimir para que un archivo borrado en el repo no quede en la VM. Los
      # contenedores que corren no se tocan: siguen con su imagen hasta que el up de abajo los reemplace, y los
      # datos de identity-db están en el volumen identity-db-data, no en esta carpeta. Sin .git (la VM no necesita
      # historial) ni target/ (el Dockerfile compila desde src/)
      - name: Subir el proyecto
        run: |
          # shellcheck disable=SC2029  # $DEPLOY_DIR se expande en el runner a propósito
          tar -czf - --exclude=./.git --exclude=./target . \
            | ssh vm "set -e; find '$DEPLOY_DIR' -mindepth 1 -delete; tar -xzf - -C '$DEPLOY_DIR'"

      # IDENTITY_DB_* solo los toma PostgreSQL al crear el volumen la primera vez: cambiarlos después en GitHub
      # no cambia la base, y el servicio deja de conectarse. REDIS_PASSWORD y RABBITMQ_* tienen que ser los del
      # .env de infra, y JWT_SECRET el mismo del gateway (con otro, todo token da 401). ADMIN_* solo sirven al
      # arrancar sin ningún SYS_ADMIN: se escriben solo si están definidos, y después del primer despliegue se
      # pueden borrar de GitHub
      - name: Escribir el .env
        env:
          IDENTITY_DB_USER: ${{ secrets.IDENTITY_DB_USER }}
          IDENTITY_DB_PASSWORD: ${{ secrets.IDENTITY_DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_CORREO: ${{ secrets.ADMIN_CORREO }}
          ADMIN_CONTRASENA: ${{ secrets.ADMIN_CONTRASENA }}
        run: |
          # Por stdin: los secrets no quedan en la línea de comandos de la VM (ps, historial) ni en el log
          # shellcheck disable=SC2029  # $DEPLOY_DIR se expande en el runner a propósito
          {
            printf 'IDENTITY_DB_USER=%s\n' "$IDENTITY_DB_USER"
            printf 'IDENTITY_DB_PASSWORD=%s\n' "$IDENTITY_DB_PASSWORD"
            printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
            printf 'RABBITMQ_USER=%s\n' "$RABBITMQ_USER"
            printf 'RABBITMQ_PASSWORD=%s\n' "$RABBITMQ_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            if [ -n "$ADMIN_CORREO" ]; then printf 'ADMIN_CORREO=%s\n' "$ADMIN_CORREO"; fi
            if [ -n "$ADMIN_CONTRASENA" ]; then printf 'ADMIN_CONTRASENA=%s\n' "$ADMIN_CONTRASENA"; fi
          } | ssh vm "umask 077 && cat > '$DEPLOY_DIR/.env'"

      # Compila la imagen en la VM y reemplaza el contenedor; identity-db solo se recrea si cambió su parte del
      # compose. --wait hace fallar el job si alguno no queda healthy (el health de actuator incluye la base,
      # Redis y RabbitMQ; el healthcheck tarda hasta ~3 min en rendirse). La compilación con Maven se suma a ese tiempo,
      # por eso el timeout del job. prune borra la imagen anterior, que quedó sin tag. Nunca down -v: borraría
      # la base
      - name: Compilar y levantar en la VM
        timeout-minutes: 20
        run: |
          # shellcheck disable=SC2029  # $DEPLOY_DIR se expande en el runner a propósito
          ssh vm "set -e
            cd '$DEPLOY_DIR'
            docker compose up -d --build --wait --wait-timeout 300
            docker image prune -f"

      - name: Comprobar health
        run: ssh vm "curl -fsS localhost:8081/actuator/health"
